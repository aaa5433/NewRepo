<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF7">
  <title>좋은습관</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

<div class="app">

  <main class="page-panel" data-page="home">
    <!-- Header -->
    <header class="header">
      <!-- <div class="brand">
        <div class="brand-icon">✎</div>
        <h1>좋은습관</h1>
      </div> -->
    </header>


    <!-- Weekly -->
    <section class="section weekly-section" id="weeklySummary">
      <div class="section-heading">
        <h2>Weekly <span class="arrow">›</span></h2>
        <div class="week-controls">
          <button id="prevWeek" class="round-button">‹</button>
          <button id="currentWeek" class="week-select">이번주</button>
          <button id="nextWeek" class="round-button">›</button>
        </div>
      </div>

      <div class="calendar-card">
        <div class="calendar" id="calendar"></div>
        <div class="calendar-events" id="calendarEvents"></div>
      </div>
    </section>

    <!-- Upcoming Schedule -->
    <section class="section schedule-section">
      <div class="section-heading">
        <h2>가까운 일정 <span class="arrow">›</span></h2>
      </div>
      <div class="schedule-item">
        <div class="schedule-date">
          <strong>11.18</strong>
          <span>수요일</span>
        </div>
        <div class="schedule-info">
          <strong>종프 휴강♥</strong>
          <span>오후 2:00 · 학교</span>
        </div>
      </div>
    </section>

    <!-- Quick Memo -->
    <section class="section quick-section">
      <div class="section-heading">
        <h2>퀵메모 <span class="arrow">›</span></h2>
      </div>
      <div class="memo-list" id="memoList"></div>
    </section>
    
    <!-- Daily Habit -->
    <section class="section habit-section">
      <div class="section-heading">
        <h2>데일리 <span class="arrow">›</span></h2>
        <span class="progress-count" id="progressCount">2 / 4</span>
      </div>

      <div class="habit-card">
        <div class="habit-list" id="habitList"></div>
        <button class="add-habit" id="addHabit" aria-label="습관 추가"></button>
      </div>
    </section>
  </main>

  <main class="page-panel weekly-detail-page" data-page="weekly">
    <section class="section weekly-detail-section">
      <div class="section-heading">
        <h2>월간 달력</h2>
        <div class="week-controls">
          <button class="round-button month-nav-button" id="prevMonth" aria-label="지난 달">‹</button>
          <button class="week-select" id="monthLabel" aria-live="polite"></button>
          <button class="round-button month-nav-button" id="nextMonth" aria-label="다음 달">›</button>
          <button class="week-select" id="goToToday">오늘</button>
        </div>
      </div>

      <div class="calendar-card">
        <div class="month-weekdays" aria-hidden="true">
          <span class="sunday">일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span class="saturday">토</span>
        </div>
        <div class="month-calendar-grid" id="monthCalendar"></div>
      </div>
    </section>

    <section class="section weekly-agenda">
      <div class="section-heading">
        <h2>주간 일정</h2>
      </div>
      <div id="weeklyScheduleList"></div>
    </section>
  </main>

  <main class="page-panel" data-page="daily">
    <section class="section habit-section">
      <div class="section-heading">
        <h2>데일리</h2>
        <span class="progress-count" id="dailyProgressCount">2 / 4</span>
      </div>

      <div class="habit-card">
        <div class="habit-list" id="dailyHabitList"></div>
        <button class="add-habit" type="button" aria-label="습관 추가"></button>
      </div>
    </section>

    <section class="daily-mission-card" aria-labelledby="dailyMissionTitle">
      <h2 id="dailyMissionTitle">Daily mission</h2>
      <div class="mission-progress-grid" id="missionProgressGrid" aria-label="최근 35일 습관 달성 현황"></div>
      <div class="mission-rewards" aria-label="오늘의 보상">
        <span class="mission-medal" data-reward="1" aria-label="1단계">
          <img src="img/medal-grey.png" data-earned-src="img/bronze.png" alt="">
        </span>
        <span class="mission-medal" data-reward="2" aria-label="2단계">
          <img src="img/medal-grey.png" data-earned-src="img/silver.png" alt="">
        </span>
        <span class="mission-medal" data-reward="3" aria-label="3단계">
          <img src="img/medal-grey.png" data-earned-src="img/gold.png" alt="">
        </span>
        <span class="mission-medal" data-reward="4" aria-label="4단계">
          <img src="img/diamond-grey.png" data-earned-src="img/diamond.png" alt="">
        </span>
        <span class="mission-trophy" aria-label="오늘의 미션 완료">
          <img src="img/trophy-grey.png" data-earned-src="img/trophy.png" alt="">
        </span>
      </div>
    </section>
  </main>

  <main class="page-panel" data-page="settings">
    <section class="section">
      <div class="section-heading"><h2>설정</h2></div>
      <div class="schedule-item">
        <div class="schedule-info"><strong>설정 화면</strong><span>준비 중입니다.</span></div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" data-page="home">
    <section class="memo-input">
      <input id="memoInput" type="text" placeholder="퀵메모 입력" maxlength="100">
      <button id="addMemo" aria-label="메모 추가">＋</button>
      <button class="mic-button" aria-label="음성 입력">♩</button>
    </section>
    <div class="nav-items">
      <a class="nav-item" href="#home">
        <span class="nav-icon">⌂</span>
        <span>홈</span>
      </a>
      <a class="nav-item" href="#weekly">
        <span class="nav-icon">▣</span>
        <span>Weekly</span>
      </a>
      <a class="nav-item" href="#daily">
        <span class="nav-icon">♧</span>
        <span>데일리</span>
      </a>
      <a class="nav-item" href="#settings">
        <span class="nav-icon">⚙</span>
        <span>설정</span>
      </a>
    </div>
  </nav>

</div>

<!-- Memo Detail Popup -->
<div class="modal-overlay" id="memoModal">
  <div class="memo-modal">
    <button class="modal-close" id="closeModal">×</button>
    <div class="modal-label">QUICK MEMO</div>

    <textarea id="modalText" placeholder="메모 내용"></textarea>

    <div class="modal-bottom">
      <span class="memo-date" id="modalDate">26.11.18 수</span>
      <label class="todo-label">
        <input type="checkbox" id="todoCheck">
        <span>Todo</span>
      </label>
    </div>

    <div class="audio-player">
      <button id="playAudio">▶</button>
      <div class="audio-track">
        <div class="audio-progress" id="audioProgress"></div>
      </div>
      <span>음성 메모</span>
    </div>

    <button class="save-memo" id="saveMemo">저장</button>
    <button class="delete-memo" id="deleteMemo">닫기</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
